date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 300
session.cookie_httponly = On
session.cookie_samesite = Lax
opcache.enable = 1
opcache.validate_timestamps = 1
; Staging mail is disabled. Configure SMTP and controlled egress for production.
sendmail_path = /bin/false