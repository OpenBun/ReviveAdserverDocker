ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php
    RedirectMatch 302 ^/$ /app/www/admin/
    # Traefik terminates TLS and sets this header for the dedicated HTTPS route.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /var/www/html>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/html/app>
        Require all denied
        <Files "index.php">
            Require all granted
        </Files>
    </Directory>
    <Directory /var/www/html/app/www>
        Require all granted
        AllowOverride AuthConfig Limit
    </Directory>
    <Directory /var/www/html/app/www/images>
        AllowOverride None
        Options -Indexes -Includes -ExecCGI
        php_admin_flag engine Off
        <FilesMatch "(?i)\.(php[0-9]*|phtml|pht|phar|cgi|pl|sh)(\.|$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    # Exclude tracking query strings from access logs.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" revive
    CustomLog /proc/self/fd/1 revive
</VirtualHost>