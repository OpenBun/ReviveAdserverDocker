name: ${COMPOSE_PROJECT_NAME:-revive-staging}

x-revive: &revive
  image: local/revive-adserver:${REVIVE_COMMIT:-5cc7dd9673af30302061c62a0207cbdfd03b7026}
  build:
    context: .
    args:
      REVIVE_COMMIT: ${REVIVE_COMMIT:-5cc7dd9673af30302061c62a0207cbdfd03b7026}
      REVIVE_VERSION: ${REVIVE_VERSION:-6.1.0-dev}
  environment:
    REVIVE_HOST: ${PUBLIC_HOST:-localhost:8080}
    TZ: UTC
    HTTP_PROXY: http://127.0.0.1:9
    HTTPS_PROXY: http://127.0.0.1:9
    ALL_PROXY: http://127.0.0.1:9
    NO_PROXY: localhost,127.0.0.1,db
  volumes:
    - ${STATE_DIR:?Run python3 scripts/manage.py init first}/var:/var/www/html/app/var
    - ${STATE_DIR}/images:/var/www/html/app/www/images
    - ${STATE_DIR}/plugins:/var/www/html/app/plugins
    - ${STATE_DIR}/admin-plugins:/var/www/html/app/www/admin/plugins
    - ${STATE_DIR}/previous:/previous:ro
  networks: [private]
  depends_on:
    db:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: revive
      MARIADB_USER: revive
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      TZ: UTC
    secrets: [db_password, db_root_password]
    volumes:
      - db-data-114:/var/lib/mysql
    networks: [private]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    <<: *revive
    restart: unless-stopped
    networks: [private, frontend]
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  maintenance:
    <<: *revive
    profiles: [maintenance]
    restart: unless-stopped
    command: [maintenance]

networks:
  private:
    internal: true
  frontend:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"

volumes:
  db-data-114:

secrets:
  db_password:
    file: ${STATE_DIR}/secrets/db_password
  db_root_password:
    file: ${STATE_DIR}/secrets/db_root_password